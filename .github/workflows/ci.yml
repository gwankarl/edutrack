name: EduTrack CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck all workspaces
        run: npm run typecheck

  unit-build:
    name: Unit tests and production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm run test:unit --workspace=backend

      - name: Run frontend tests
        run: npm run test --workspace=frontend

      - name: Build applicable workspaces
        run: npm run build --workspaces --if-present

  db-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: edutrack_test
          POSTGRES_PASSWORD: edutrack_test_ci_password
          POSTGRES_DB: edutrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edutrack_test -d edutrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://edutrack_test:edutrack_test_ci_password@localhost:5432/edutrack_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create isolated integration environment
        run: |
          printf 'NODE_ENV=%s\nDATABASE_URL=%s\n' "$NODE_ENV" "$DATABASE_URL" > backend/.env.test

      - name: Apply migrations to the isolated test database
        run: npm run db:migrate --workspace=backend

      - name: Run PostgreSQL integration tests
        run: npm run test:integration --workspace=backend

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      CI: "true"
      E2E_HOST: 127.0.0.1
      E2E_FRONTEND_PORT: "5173"
      E2E_BACKEND_PORT: "5000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright reports after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
